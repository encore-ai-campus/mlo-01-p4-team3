{% load meeting %}<span class="notebook-marks" role="group" aria-label="{{ mark_name|display_name }} 수첩 표시">{% with current=mark_value|notebook_mark %}{% for value, label in notebook_mark_choices %}{% with key="mark:"|add:value %}<button type="button" data-mark-person="{{ mark_npc }}" data-mark-value="{{ value }}" aria-pressed="{% if current == value %}true{% else %}false{% endif %}"{% tip key name=mark_name|display_name %}>{{ label }}</button>{% endwith %}{% endfor %}{% endwith %}</span>
