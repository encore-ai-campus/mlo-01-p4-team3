<section id="game-result" aria-labelledby="game-result-title">
  <h2 id="game-result-title">판 종료 결과</h2>
  {% if game_result.completed %}<p>{{ game_result.winner }} · {{ game_result.day }}일째</p><p>{{ game_result.reason }}</p>
  {% else %}<p>중단된 판입니다.</p>{% endif %}
  {% if game_result.lines %}<h3>{{ game_result.ending_title }}</h3>{% for line in game_result.lines %}<p>{{ line }}</p>{% endfor %}{% endif %}
  <a href="{% url 'player-progress' %}">모은 원한 단서 보기</a>
</section>
