{% load meeting %}{# 튜토리얼 종료: 족제비 마무리 말풍선(tutorial.lines)과 처음부터 다시·홈으로. 설문·결과 광고·원한 단서 탭은 game_end.html에서 뺀다. #}
<aside class="end-guide tutorial-end" aria-label="족제비 안내" data-tutorial-end><img src="{% review_asset 'mascot:jokjebi' %}" alt="안내하는 족제비" width="96" height="96"><div class="end-guide-bubble">{% for line in tutorial.lines %}<p>{{ line.text }}</p>{% endfor %}
  <div class="tutorial-end-actions"><form method="post" action="{{ tutorial.restart.url }}">{% csrf_token %}<input type="hidden" name="start_token" value="{{ tutorial.restart.start_token }}">{% if tutorial.restart.mudang_variant %}<input type="hidden" name="mudang_variant" value="{{ tutorial.restart.mudang_variant }}">{% endif %}<button type="submit" title="튜토리얼을 새 판으로 처음부터 다시 합니다">처음부터 다시 하기</button></form><a href="{% url 'home' %}">홈으로</a></div></div></aside>
