{% load meeting %}{% with expression=vn_expressions|get_item:line.line_id %}<p class="vn-source" data-line-id="{{ line.line_id }}" data-day="{{ line.day }}" data-phase="{{ line.phase }}" data-speaker="{{ line.speaker }}"{% if line.speaker_id %} data-speaker-id="{{ line.speaker_id }}"{% endif %}{% if line.sprite_id %} data-sprite="{% if line.speaker_id and not line.guide and not line.mascot %}{% vn_sprite line.speaker_id expression mudang_portrait_id %}{% else %}{% review_asset line.sprite_id %}{% endif %}"{% endif %}{% if expression %} data-expression="{{ expression }}"{% endif %}{% if line.full %} data-full="true"{% endif %}{% if line.actor_name %} data-actor-name="{{ line.actor_name }}"{% endif %}{% if line.beat %} data-beat="true"{% endif %}{% if line.result %} data-result="true"{% endif %}{% if line.guide %} data-guide="true"{% endif %}{% if line.mascot %} data-mascot="true"{% endif %}><span class="vn-source-text">{{ line.text }}</span>{% if line.line_id in vn_tell_lines %} <span class="vn-tell-notice" data-vn-tell>{{ vn_tell_notice }}</span>{% endif %}</p>{% endwith %}
