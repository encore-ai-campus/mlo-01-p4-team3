{% load meeting %}<p class="vn-source" data-line-id="{{ line.line_id }}" data-day="{{ line.day }}" data-phase="{{ line.phase }}" data-speaker="{{ line.speaker }}"{% if line.speaker_id %} data-speaker-id="{{ line.speaker_id }}"{% endif %}{% if line.sprite_id %} data-sprite="{% review_asset line.sprite_id %}"{% endif %}{% if line.full %} data-full="true"{% endif %}{% if line.result %} data-result="true"{% endif %}{% if line.guide %} data-guide="true"{% endif %}><span class="vn-source-text">{{ line.text }}</span></p>
