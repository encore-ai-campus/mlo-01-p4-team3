<fieldset><legend>이번 판의 결말</legend>
  <select name="ending_choice" aria-label="이번 판의 결말">
    {% for ending in ending_options %}<option value="{{ ending.value }}"{% if not ending.unlocked %} disabled{% endif %}>{{ ending.title }}{% if not ending.unlocked %} · 단서를 더 모으면 선택할 수 있습니다{% endif %}</option>{% endfor %}
  </select>
  <p>결말 선택은 승패 규칙을 바꾸지 않습니다.</p>
</fieldset>
<fieldset disabled><legend>선택형 도전 · 준비 중</legend>
  <label><input type="checkbox">점 1회 제한</label>
  <label><input type="checkbox">비밀 있는 주민 3명</label>
  <label><input type="checkbox">목격 정보 축소</label>
  <p>검증된 도전이 공개되면 선택할 수 있습니다.</p>
</fieldset>
