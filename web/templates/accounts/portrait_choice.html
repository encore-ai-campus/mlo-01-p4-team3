{% load meeting %}
<fieldset class="portrait-choice avatar-choices">
  <legend>무당 모습 선택</legend>
  <label><input type="radio" name="mudang_variant" value="f" checked required data-avatar-src="{% review_asset 'sprite:mudang_f' %}">
    <img src="{% review_asset 'portrait:mudang_f' %}" alt="" width="80" height="100"> <span>여성 무당</span></label>
  <label><input type="radio" name="mudang_variant" value="m" required data-avatar-src="{% review_asset 'sprite:mudang_m' %}">

  <p>모습만 달라집니다. 게임 규칙과 인물의 반응에는 영향을 주지 않습니다.</p>
</fieldset>
