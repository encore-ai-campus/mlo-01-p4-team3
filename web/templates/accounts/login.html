{% extends "accounts/base.html" %}{% block content %}
<div class="auth-layout">{% load meeting %}{% include "accounts/scene_intro.html" %}<section class="auth-content"><h1>로그인</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form class="auth-form" method="post" action="{% url 'accounts:login' %}">{% csrf_token %}
<p><label>로그인 ID <input name="username" maxlength="150" autocomplete="username" required></label></p>
<p><label>비밀번호 <input name="password" type="password" maxlength="128" autocomplete="current-password" required></label></p>
<p class="account-help">비밀번호를 잊으면 운영자에게 문의</p><button>로그인</button></form><p class="account-switch">아직 계정이 없으신가요? <a href="{% url 'accounts:signup' %}">가입</a></p></section></div>{% endblock %}
