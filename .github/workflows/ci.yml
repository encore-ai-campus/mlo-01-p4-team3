# 필수 체크 4개(docs/tasks/README.md 3절 ②, E-05-02). 설명은 docs/modules/ci.md.
# PR 본문은 셸 명령에 직접 넣지 않고 환경 변수 PR_BODY로 넘긴다(README 11절).
name: ci
on: [pull_request, push]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }   # 프로젝트 전체 Python 3.14 단일(11/5 PM 결정, tech_stack.md)
      - run: python -m unittest discover -s tests -t .
      - run: python -m tools.check_secrets

  django:
    runs-on: ubuntu-latest
    services:
      mongo: { image: "mongo:8.0.34", ports: ["27017:27017"] }
      mysql: { image: "mysql:8.4.13", env: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes" }, ports: ["3306:3306"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # 외부 서비스가 필요한 테스트는 core에서 빼고 여기서 경로별로 돈다(11/4 PM 결정 #12).
      # 폴더를 처음 만드는 태스크(C-06-01 tests/infra, D-05-03 tests/ads)가 그 폴더 __init__.py에
      # load_tests를 두어 PALDO_SERVICE_TESTS가 없으면 빈 묶음을 돌려준다. 폴더가 없으면 건너뛰지 않고 통과한다.
      - name: Mongo 테스트(tests/infra)
        env: { PALDO_SERVICE_TESTS: "1" }
        run: |
          if [ -d tests/infra ]; then python -m unittest discover -s tests/infra -t .; else echo "tests/infra 없음(C-06-01 전)"; fi
      - name: 광고 테스트(tests/ads)
        env: { PALDO_SERVICE_TESTS: "1" }
        run: |
          if [ -d tests/ads ]; then python -m unittest discover -s tests/ads -t .; else echo "tests/ads 없음(D-05-03 전)"; fi
      # server/manage.py가 생기기 전의 빈 단계(E-05-02 조건 1). B-05-01 병합과 함께 아래 두 줄로 바꾼다.
      #   - run: pip install -r server/requirements.txt
      #   - run: cd server && PALDO_SERVICE_TESTS=1 python manage.py test
      - name: Django 테스트(빈 단계, B-05-01 전)
        run: echo "server/manage.py 없음. B-05-01 병합 때 python manage.py test로 바꾼다."

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: PR 본문의 태스크 ID로 증빙 검사
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m tools.check_evidence --pr-body-env PR_BODY --changed "$BASE_SHA"
      - name: push에서 바뀐 증빙 형식 검사
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python -m tools.check_evidence --changed "$BEFORE_SHA"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: 문서화 검사(PR 변경분)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m tools.check_docs --diff "$BASE_SHA"
