apiVersion: batch/v1
kind: CronJob
metadata:
  name: paldo-retrain
  namespace: paldo-ml
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Seoul
  # 운영 매일 밤 재학습은 이 CronJob이 아니라 게임 웹 서버(app-01)의 systemd 타이머가 실행한다(관문 통과 시 자동 승격, docs/modules/ml.md 한계 절).
  # 이 파일은 k3s로 옮길 때 쓰는 대안 정의라 꺼진 채로 둔다.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            paldo-role: simulation
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retrain
              image: "${RETRAIN_IMAGE}"
              imagePullPolicy: Never
              command: ["python", "-m", "ops.mlflow.job"]
              workingDir: /inputs/repository
              args: ["--config", "/run/retrain/config.json", "--out", "/work"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONPATH
                  value: /inputs/repository
              envFrom:
                - secretRef:
                    name: paldo-mlflow-client
              resources:
                requests: {cpu: "500m", memory: 1Gi}
                limits: {cpu: "2", memory: 3Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - {name: config, mountPath: /run/retrain, readOnly: true}
                - {name: inputs, mountPath: /inputs, readOnly: true}
                - {name: output, mountPath: /work}
                - {name: temporary, mountPath: /tmp}
          volumes:
            - name: config
              secret: {secretName: paldo-retrain-config, defaultMode: 288}
            - name: inputs
              persistentVolumeClaim: {claimName: paldo-reviewed-training}
            - name: output
              persistentVolumeClaim: {claimName: paldo-retrain-runs}
            - name: temporary
              emptyDir: {}
