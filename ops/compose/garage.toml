# 로컬 개발용 Garage 1노드 설정(ops/compose/dev.yml).
# rpc_secret·admin_token은 여기 쓰지 않는다. .env의 GARAGE_RPC_SECRET·GARAGE_ADMIN_TOKEN 환경 변수로 받는다.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
