# 로컬 개발용 Prometheus 수집 대상(ops/compose/dev.yml). 서비스 /metrics 수집·경보는 C-08-01에서 늘린다.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: garage
    static_configs:
      - targets: ["garage:3903"]
  # 게임 웹 daphne 2개(E-09-10). 호스트에서 띄운 프로세스를 수집한다. process 라벨로 두 프로세스를 구분한다.
  # host.docker.internal로 호스트 loopback(127.0.0.1)에 닿는 것은 Docker Desktop(Windows·macOS) 기준이다. Linux Docker는
  # 게이트웨이 주소로 가므로 loopback 웹에 닿지 않는다(운영 수집 경로는 C-08-01, ops/proxy/README.md "웹 프로세스 2개").
  # Django는 PALDO_PUBLIC_ORIGIN 호스트만 받으므로 웹을 PALDO_EXTRA_ALLOWED_HOSTS=host.docker.internal로 띄운다(없으면 400).
  # Prometheus는 Host 헤더를 바꿀 수 없다.
  # 웹을 띄우지 않았으면 down으로 보이며 스모크 검사(PROMETHEUS_JOBS) 대상이 아니다. 1개로 되돌리면 web-2는 down이 정상이다.
  - job_name: paldo-web
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: {process: web-1}
      - targets: ["host.docker.internal:8002"]
        labels: {process: web-2}
